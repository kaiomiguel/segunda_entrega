<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Blog{% endblock %}</title>
</head>

<body>

    <!-- Barra superior -->
    <nav>
        <a href="{% url 'post_list' %}">Início</a> |
        <a href="{% url 'post_create' %}">Criar novo post</a> |
        
        {% if user.is_authenticated %}
            Logado como <strong>{{ user.username }}</strong> |
            <!-- Alteração: link seguro para logout -->
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; padding:0; color:blue; cursor:pointer;">Sair</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    <hr>

    <!-- Área onde cada página coloca o conteúdo -->
    {% block content %}
    {% endblock %}

</body>
</html>
