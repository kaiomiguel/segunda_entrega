{% extends 'posts/base.html' %}

{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}
<h2>{{ post.titulo }}</h2>
<p><small>{{ post.data_postagem|date:"d/m/Y H:i" }}</small></p>

<div>
    {{ post.conteudo|safe }}
</div>

<hr>
<a href="{% url 'post_edit' post.id %}">Editar</a> |
<a href="{% url 'post_delete' post.id %}">Remover</a>
{% endblock %}
