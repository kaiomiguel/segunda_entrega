{% extends 'posts/base.html' %}

{% block content %}
<h2>Criar Post</h2>

<form method="POST">
    {% csrf_token %}
    
    <label>Título:</label><br>
    <input type="text" name="titulo"><br><br>

    <label>Conteúdo (HTML permitido):</label><br>
    <textarea name="conteudo" rows="10"></textarea><br><br>

    <button type="submit">Salvar</button>
</form>
{% endblock %}
