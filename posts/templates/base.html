<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Blog{% endblock %}</title>
</head>
<body>
<header>
    <h1>Meu Blog</h1>
    <nav>
        <a href="{% url 'post_list' %}">Início</a> |
        <a href="{% url 'category_list' %}">Categorias</a> |  <!-- novo link -->
        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">Sair</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
    <hr>
</header>

    {% block content %}{% endblock %}

</body>
</html>
